<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>鲦•tiao</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2322d3ee'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='20' fill='white'>鲦</text></svg>">
<link rel="stylesheet" href="/static/prism.min.css?v=5">
<link rel="stylesheet" href="/static/diff2html.min.css?v=5">
<link rel="stylesheet" href="/static/web_ui.css?v=5">
</head>
<body>

<!-- 侧边栏 -->
<aside id="sidebar" role="navigation" aria-label="侧边栏">
  <div id="sidebar-top">
    <button id="sidebar-close-btn" title="收起侧边栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </div>

  <!-- 侧边栏主体（会话参数） -->
  <div id="sidebar-body">
    <div class="ss-section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-3px;margin-right:4px"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="8" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
      会话参数
    </div>
    <div class="ss-row">
      <label>温度 <span id="ss-temp-val">0.7</span></label>
      <input type="range" id="ss-temp-slider" min="0" max="2" step="0.1" value="0.7">
    </div>
    <div class="ss-row disabled" id="ss-topp-row">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <label>top_p <span id="ss-topp-val">0.9</span></label>
        <button class="mini-toggle" id="ss-topp-toggle">关</button>
      </div>
      <input type="range" id="ss-topp-slider" min="0" max="1" step="0.05" value="0.9" disabled>
    </div>
    <div class="ss-row">
      <label>场景预设</label>
      <div class="ss-presets" id="ss-presets">
        <button class="ss-preset active" data-profile="default">通用</button>
        <button class="ss-preset" data-profile="code">代码</button>
        <button class="ss-preset" data-profile="debug">调试</button>
        <button class="ss-preset" data-profile="review">审查</button>
      </div>
    </div>
    <div class="ss-row">
      <label>思考深度</label>
      <div class="ss-presets" id="ss-reasoning">
        <button class="ss-preset active" data-effort="high">High</button>
        <button class="ss-preset" data-effort="max">Max</button>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);margin:8px 0"></div>
    <div class="ss-row">
      <label>权限</label>
      <div class="ss-presets" id="ss-sudo">
        <button class="ss-preset active" data-level="default">默认</button>
        <button class="ss-preset" data-level="su">su</button>
        <button class="ss-preset" data-level="su+">su+</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
      <button class="mini-toggle" id="ss-sudo-persist">关</button>
      <span style="font-size:11px;color:var(--text-secondary)">持久化</span>
    </div>
    <div style="border-top:1px solid var(--border);margin:8px 0"></div>
    <div class="ss-row" id="ss-tools-entry" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-bottom:0">
      <label style="cursor:pointer;margin-bottom:0">工具管理</label>
      <span style="color:var(--text-secondary);font-size:16px">›</span>
    </div>
  </div>

  <div id="sidebar-footer">
    <button id="theme-btn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <span id="sidebar-version">2.1.0</span>
    <button id="settings-btn" title="服务端设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</aside>
<div id="sidebar-overlay"></div>

<!-- 主区域 -->
<div id="main-area">
  <header id="header">
    <button id="header-sidebar-btn" aria-label="会话列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    </button>
    <div class="header-center">
      <button id="header-model-btn" aria-label="历史会话"> 
        <span id="header-model">历史会话</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>
    <button id="header-new-btn" title="新建会话" style="width:36px;height:36px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:8px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </header>
  <main id="messages" role="log" aria-live="polite" aria-label="对话内容">
    <div class="empty-state" id="empty-state">
      <img src="/icon/tiao.png" class="tiao-logo" alt="鲦">
    </div>
  </main>
  <footer id="input-area">
    <div id="input-card">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="输入消息..." autofocus></textarea>
        <button id="expand-btn" title="展开输入" aria-label="展开输入" style="width:32px;height:32px;border-radius:6px;background:transparent;border:none;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
      <div id="input-toolbar">
        <div class="input-tags">
          <button class="tag-btn" id="tag-think" title="深度思考">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg>
            <span>深度思考</span>
          </button>
          <button class="tag-btn" id="tag-model" title="切换模型">
            <span id="tag-model-label">Flash</span>
          </button>
        </div>
        <div class="input-actions">
          <button id="send-btn" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </div>
  </footer>
</div>

<div id="confirm-overlay" role="dialog" aria-modal="true" aria-label="操作确认">
  <div id="confirm-card">
    <div id="confirm-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;color:var(--accent-yellow);flex-shrink:0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>执行确认</span><span id="confirm-timer" style="font-size:11px;color:var(--text-secondary);margin-left:auto"></span></div>
    <div id="confirm-desc"></div>
    <div id="confirm-actions">
      <button class="confirm-btn secondary" id="confirm-cancel">取消</button>
      <button class="confirm-btn primary" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<button id="scroll-down-btn" onclick="document.getElementById('messages').scrollTo({top:document.getElementById('messages').scrollHeight,behavior:'smooth'})" title="滚动到底部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="6 9 12 15 18 9"/></svg>
</button>
  <!-- 删除确认（复用 confirm-overlay，动态设置内容） -->

  <!-- 重命名浮层 -->
  <div id="rename-overlay" role="dialog" aria-modal="true" aria-label="重命名会话">
    <div id="rename-card">
      <h3>重命名会话</h3>
      <input type="text" id="rename-input" placeholder="输入新标题..." autofocus>
      <div id="rename-actions">
        <button id="rename-cancel">取消</button>
        <button id="rename-save">保存</button>
      </div>
    </div>
  </div>

<!-- 历史会话浮层面板 -->
<div id="sessions-panel">
  <div class="model-panel-header">
    <span class="model-panel-title">历史会话</span>
    <button id="sessions-panel-close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="model-panel-body">
    <div id="sessions-list"></div>
  </div>
  <div class="model-panel-footer">
    <input type="text" id="sessions-search" placeholder="搜索会话...">
    <div id="sessions-batch" style="display:none;align-items:center;gap:10px;flex-shrink:0;margin-left:auto">
<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);cursor:pointer;white-space:nowrap">
<input type="checkbox" id="sessions-select-all" style="width:14px;height:14px;accent-color:var(--accent-cyan);cursor:pointer"> 全选
</label>
<button id="sessions-delete-btn" style="padding:4px 10px;border:1px solid var(--accent-red);border-radius:6px;background:transparent;color:var(--accent-red);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap">删除选中</button>
<button id="sessions-rename-btn" style="padding:4px 10px;border:1px solid var(--accent-cyan);border-radius:6px;background:transparent;color:var(--accent-cyan);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap">重命名</button>
</div>
  </div>
</div>

<!-- 会话操作菜单 -->
<div id="session-menu" style="display:none">
  <div class="session-menu-item" id="session-menu-regenerate">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    重新生成标题
  </div>
</div>

<!-- 工具管理浮层 -->
<div id="tools-panel" style="display:none">
  <div id="tools-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:55;background:rgba(0,0,0,0.5)" onclick="Panel.closeTools()"></div>
  <div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:56;background:var(--bg-primary);border:1px solid var(--border);border-radius:16px;width:min(400px,90vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,0.4)">
    <div class="model-panel-header">
      <span class="model-panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;margin-right:6px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>工具管理</span>
      <button onclick="Panel.closeTools()" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="model-panel-body" id="tools-list" style="flex:1;overflow-y:auto;padding:8px 0">
      <div style="text-align:center;padding:24px;color:var(--text-secondary);font-size:14px">加载中...</div>
    </div>
    <div class="model-panel-footer" style="display:flex;gap:6px;padding:8px 12px">
      <button class="op-btn" onclick="Panel.toggleAllTools(true)" style="flex:1;font-size:12px">全开</button>
      <button class="op-btn" onclick="Panel.toggleAllTools(false)" style="flex:1;font-size:12px">全关</button>
      <button class="op-btn" onclick="Panel.resetTools()" style="flex:1;font-size:12px">重置</button>
    </div>
  </div>
</div>

<!-- 服务端设置（浮层） -->
<div id="settings-overlay" style="display:none">
  <div id="settings-card" class="op-card">
    <div class="op-header">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;vertical-align:-4px;margin-right:4px"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/></svg>服务端设置</span>
      <button id="op-close-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="op-body">
      <button id="op-shutdown" class="op-btn op-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>关闭服务</button>
      <button id="op-restart" class="op-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>重启服务</button>
      <div class="op-divider"></div>
      <button id="op-about" class="op-btn op-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>查看项目源码</button>
    </div>
  </div>
</div>

<!-- 展开输入浮层 -->
<div id="input-expand-overlay">
  <div id="input-expand-header">
    <span>编辑消息</span>
    <button id="input-expand-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="input-expand-body">
    <textarea id="input-expand-textarea" placeholder="输入消息..." style="display:block"></textarea>
  </div>
  <div id="input-expand-footer">
    <div class="input-tags">
      <button class="tag-btn" id="exp-tag-think" title="深度思考">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg>
        <span>深度思考</span>
      </button>
      <button class="tag-btn" id="exp-tag-model" title="切换模型">
        <span id="exp-tag-model-label">Flash</span>
      </button>
    </div>
    <button id="input-expand-send" aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<script src="/static/marked.min.js?v=2"></script>
<script src="/static/prism.min.js?v=2"></script>
<script src="/static/prism-clike.min.js?v=2"></script>
<script src="/static/prism-markup.min.js?v=2"></script>
<script src="/static/prism-css.min.js?v=2"></script>
<script src="/static/prism-c.min.js?v=2"></script>
<script src="/static/prism-cpp.min.js?v=2"></script>
<script src="/static/prism-java.min.js?v=2"></script>
<script src="/static/prism-typescript.min.js?v=2"></script>
<script src="/static/prism-sql.min.js?v=2"></script>
<script src="/static/prism-markdown.min.js?v=2"></script>
<script src="/static/prism-python.min.js?v=2"></script>
<script src="/static/prism-javascript.min.js?v=2"></script>
<script src="/static/prism-bash.min.js?v=2"></script>
<script src="/static/prism-go.min.js?v=2"></script>
<script src="/static/prism-rust.min.js?v=2"></script>
<script src="/static/prism-yaml.min.js?v=2"></script>
<script src="/static/prism-json.min.js?v=2"></script>
<script src="/static/prism-diff.min.js?v=2"></script>
<script src="/static/diff2html-ui.min.js?v=2"></script>

<script src="/static/utils.js?v=5"></script>
<script src="/static/sse.js?v=5"></script>
<script src="/static/render/think.js?v=8"></script>


<script src="/static/render/content.js?v=5"></script>
<script src="/static/render/message.js?v=5"></script>
<script src="/static/chat/send.js?v=5"></script>
<script src="/static/panel.js?v=5"></script>
<script src="/static/web_ui.js?v=5"></script>




</body>
</html>
